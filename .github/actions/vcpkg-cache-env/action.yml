name: Export vcpkg binary cache env
description: |
  Caches vcpkg binary archives via actions/cache@v4 and pre-populates the
  lua-5.5.1.tar.gz source archive with retries to avoid transient lua.org SSL
  and timeout failures.

  Used by workflows that run `cmake --preset` against the vcpkg toolchain
  (build.yml, package.yml, benchmark.yml).

runs:
  using: composite
  steps:
    - name: Configure vcpkg binary and downloads cache directories
      shell: bash
      run: |
        cache_dir="${RUNNER_TEMP}/vcpkg-bincache"
        dl_dir="${RUNNER_TEMP}/vcpkg-downloads"
        mkdir -p "$cache_dir" "$dl_dir"
        if command -v cygpath >/dev/null 2>&1; then
          cache_dir="$(cygpath -w "$cache_dir")"
          dl_dir="$(cygpath -w "$dl_dir")"
        fi
        echo "VCPKG_BINARY_SOURCES=clear;files,${cache_dir},readwrite" >> "$GITHUB_ENV"
        echo "VCPKG_DOWNLOADS=${dl_dir}" >> "$GITHUB_ENV"
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          echo "VCPKG_CACHE_ABI=${ImageOS:-windows}-msvc" >> "$GITHUB_ENV"
        else
          cc_abi="$("${CC:-cc}" -dumpfullversion -dumpmachine 2>/dev/null | tr ' /' '__' || echo unknown)"
          echo "VCPKG_CACHE_ABI=${ImageOS:-unknown}-${cc_abi}" >> "$GITHUB_ENV"
        fi
    - name: Restore/save vcpkg binary and downloads cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/vcpkg-bincache
          ${{ runner.temp }}/vcpkg-downloads/lua-5.5.1.tar.gz
        key: vcpkg-${{ runner.os }}-${{ env.VCPKG_CACHE_ABI }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'cmake/gcc15-slp-workaround.cmake') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ env.VCPKG_CACHE_ABI }}-
    - name: Pre-fetch and verify Lua 5.5.1 tarball
      shell: bash
      run: |
        dl_dir="${RUNNER_TEMP}/vcpkg-downloads"
        tarball="$dl_dir/lua-5.5.1.tar.gz"
        expected_sha512="1c8cb3d7194732d7685f80a30e0804cb24dc6aee1f8d1383bb9fd5d0699b84c70b823e686555dfa8fd61a32f32c0c687a8419ff4aa285f39d4f3bf3d5cd635c0"

        verify_lua_tarball() {
          [ -f "$tarball" ] || return 1
          actual="$(python3 -c "import hashlib, sys; print(hashlib.sha512(open(sys.argv[1], 'rb').read()).hexdigest())" "$tarball")"
          [ "$actual" = "$expected_sha512" ]
        }

        if ! verify_lua_tarball; then
          rm -f "$tarball"
          curl -fL --connect-timeout 15 --max-time 60 --retry 8 --retry-all-errors --retry-delay 5 \
            "https://www.lua.org/ftp/lua-5.5.1.tar.gz" \
            -o "$tarball"
          if ! verify_lua_tarball; then
            echo "::error::Failed to verify SHA512 of downloaded $tarball"
            rm -f "$tarball"
            exit 1
          fi
        fi
