name: Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'vcpkg-overlay-ports/**'
      - 'libs/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'vcpkg-overlay-ports/**'
      - 'libs/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset to build'
        type: choice
        options:
          - 'all'
          - 'player-debug'
          - 'player-release'
          - 'ship-release'
        default: 'all'
      platform:
        description: 'Platform to build'
        type: choice
        options:
          - 'all'
          - 'linux'
          - 'windows'
          - 'macos'
        default: 'all'
      save_artifacts:
        description: 'Save and upload build artifacts'
        type: boolean
        default: true

# Cancel a PR's in-flight build when a newer commit lands on it — e.g. the fixup the autoformat
# workflow pushes — so the full matrix doesn't run twice.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORM: ${{ inputs.platform || 'all' }}
          INPUT_PRESET: ${{ inputs.preset || 'all' }}
        run: |
          python3 -c "
          import json, os

          event = os.environ.get('EVENT_NAME', '')
          platform_filter = os.environ.get('INPUT_PLATFORM', 'all')
          preset_filter = os.environ.get('INPUT_PRESET', 'all')

          all_platforms = [
              {'os': 'ubuntu-24.04', 'platform': 'linux'},
              {'os': 'windows-latest', 'platform': 'windows'},
              {'os': 'macos-latest', 'platform': 'macos'},
          ]

          if event == 'pull_request':
              # PRs run player-debug across all 3 OSes (GCC, MSVC, Apple Clang + ctest)
              # plus linux ship-release (bake + runtime boot smoke gates).
              matrix = [
                  {'os': 'ubuntu-24.04', 'platform': 'linux', 'preset': 'player-debug'},
                  {'os': 'ubuntu-24.04', 'platform': 'linux', 'preset': 'ship-release'},
                  {'os': 'windows-latest', 'platform': 'windows', 'preset': 'player-debug'},
                  {'os': 'macos-latest', 'platform': 'macos', 'preset': 'player-debug'},
              ]
          elif event == 'push':
              # Pushes to main cover release builds across all 3 OSes (player-release + ship-release).
              matrix = [
                  {'os': 'ubuntu-24.04', 'platform': 'linux', 'preset': 'player-release'},
                  {'os': 'ubuntu-24.04', 'platform': 'linux', 'preset': 'ship-release'},
                  {'os': 'windows-latest', 'platform': 'windows', 'preset': 'player-release'},
                  {'os': 'windows-latest', 'platform': 'windows', 'preset': 'ship-release'},
                  {'os': 'macos-latest', 'platform': 'macos', 'preset': 'player-release'},
                  {'os': 'macos-latest', 'platform': 'macos', 'preset': 'ship-release'},
              ]
          else:
              if event == 'workflow_dispatch' and platform_filter != 'all':
                  platforms = [p for p in all_platforms if p['platform'] == platform_filter]
              else:
                  platforms = all_platforms

              if event == 'workflow_dispatch' and preset_filter != 'all':
                  presets = [preset_filter]
              else:
                  presets = ['player-debug', 'player-release', 'ship-release']

              matrix = []
              for p in platforms:
                  for pr in presets:
                      matrix.append({
                          'os': p['os'],
                          'platform': p['platform'],
                          'preset': pr
                      })

          print('Matrix planned:', json.dumps(matrix))
          output_path = os.environ.get('GITHUB_OUTPUT')
          if output_path:
              with open(output_path, 'a') as f:
                  f.write(f'matrix={json.dumps(matrix)}\n')
          "

  build:
    name: ${{ matrix.platform }} (${{ matrix.preset }})
    needs: [plan, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so the advisory clang-tidy step can diff against the PR base.
          fetch-depth: 0

      - name: Checkout Example Game
        if: matrix.platform == 'linux' && (matrix.preset == 'player-debug' || matrix.preset == 'ship-release')
        uses: actions/checkout@v4
        with:
          repository: Octarine-Club/octarine-engine-example
          ref: main
          path: example_repo

      - name: Export GitHub Actions cache env (vcpkg binary cache)
        uses: ./.github/actions/vcpkg-cache-env

      - name: Install Linux build deps (SDL3 / X11 / Wayland)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/linux-build-deps

      - name: Setup MSVC dev environment (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Compiler cache for the engine build (vcpkg deps are already binary-cached separately).
      # ccache integrates cleanly with GCC/Clang on Linux/macOS; the CMakeLists auto-detects it on
      # PATH and wires CMAKE_CXX_COMPILER_LAUNCHER. Skipped on Windows/MSVC where ccache support is
      # weaker. Cache is keyed per platform+preset.
      - name: Setup ccache
        if: matrix.platform != 'windows'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.platform }}-${{ matrix.preset }}
          max-size: 250M

      - name: Configure CMake
        shell: bash
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.preset == 'player-debug' && '-DOCTARINE_ENABLE_TESTS=ON' || '' }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ contains(matrix.preset, 'debug') && 'Debug' || 'Release' }} --parallel

      # All three OSes, not just linux: MSVC-specific breakage (AVX2 chunk alignment) and
      # macOS-specific behavior otherwise ship untested. Runs on player-debug (tests enabled).
      - name: Run engine tests (ctest)
        if: matrix.preset == 'player-debug'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      # Headless bake against the example project. Catches unresolved-asset regressions and
      # AssetCatalog::Build / startup-script breakage on every PR — the bake walks the catalog,
      # runs the startup script, and emits asset_manifest.lua.
      - name: Bake smoke (example project)
        if: matrix.platform == 'linux' && (matrix.preset == 'player-debug' || matrix.preset == 'ship-release')
        shell: bash
        run: |
          cfg="${{ contains(matrix.preset, 'debug') && 'debug' || 'release' }}"
          exe="$(find "build/${{ matrix.preset }}/bin/$cfg" -maxdepth 1 -type f \( -name 'OctarineEngine' -o -name 'OctarineEngine-player' -o -name 'OctarineEngine.exe' -o -name 'OctarineEngine-player.exe' \) | head -1)"
          "$exe" "$GITHUB_WORKSPACE/example_repo" -m bake
          test -s "$GITHUB_WORKSPACE/example_repo/asset_manifest.lua"
          test -s "$GITHUB_WORKSPACE/example_repo/asset_bundle.pak"

      # Runtime boot smoke: actually run the engine against the example project, headless.
      # Runs on both player-debug (testing ImGui overlays & debug loop) and ship-release (testing
      # the shipping binary loading baked asset_bundle.pak from its executable base directory).
      - name: Runtime boot smoke (example project)
        if: matrix.platform == 'linux' && (matrix.preset == 'player-debug' || matrix.preset == 'ship-release')
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OCTARINE_CAPTURE_FRAME: "120"
        run: |
          cfg="${{ contains(matrix.preset, 'debug') && 'debug' || 'release' }}"
          exe="$(find "build/${{ matrix.preset }}/bin/$cfg" -maxdepth 1 -type f \( -name 'OctarineEngine' -o -name 'OctarineEngine-player' -o -name 'OctarineEngine.exe' -o -name 'OctarineEngine-player.exe' \) | head -1)"
          if [ "${{ matrix.preset }}" = "ship-release" ]; then
            cp "$GITHUB_WORKSPACE/example_repo/asset_bundle.pak" "$(dirname "$exe")/asset_bundle.pak"
            trap 'rm -f "$(dirname "$exe")/asset_bundle.pak"' EXIT
          fi
          export OCTARINE_CAPTURE_PATH="$RUNNER_TEMP/boot-smoke.bmp"
          log="$RUNNER_TEMP/boot-smoke.log"
          "$exe" "$GITHUB_WORKSPACE/example_repo" | tee "$log"
          test -s "$OCTARINE_CAPTURE_PATH"
          if grep -E '\[(error|critical)\]' "$log"; then
            echo "::error::Runtime boot smoke logged error/critical lines (see log above)."
            exit 1
          fi

      - name: Check Lua API artifact drift
        id: lua_drift
        if: matrix.platform == 'linux' && matrix.preset == 'player-debug'
        shell: bash
        run: |
          paths="generated/lua_api.smoke.lua generated/components.json generated/modules.json"
          if ! git diff --quiet -- $paths; then
            echo "::error::One of $paths drifted. Run OctarineLuaApiTest (player-debug preset) locally and commit the regenerated files."
            git diff -- $paths | head -400
            exit 1
          fi

      - name: Upload regenerated Lua API artifacts on drift
        if: always() && steps.lua_drift.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lua-api-artifacts-from-ci
          path: |
            generated/lua_api.smoke.lua
            generated/components.json
            generated/modules.json
          if-no-files-found: error
          retention-days: 7

      # Blocking clang-tidy over the PR's changed LINES (not whole files), using a non-PCH
      # compile_commands.json emitted by the `lint` preset with Clang so neither PCH flags nor
      # GCC-only driver flags trigger [clang-diagnostic-*] parse failures.
      - name: clang-tidy (changed lines, blocking)
        if: matrix.platform == 'linux' && matrix.preset == 'player-debug' && github.event_name == 'pull_request'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'src/*' 'tests/*' 'examples/*' | grep -E '\.cpp$' || true)"
          if [ -z "$changed" ]; then
            echo "No changed .cpp files to lint."
            exit 0
          fi
          printf 'tidying changed lines in:\n%s\n' "$(printf '  %s\n' $changed)"
          CC=clang-18 CXX=clang++-18 cmake --preset lint \
            -DOCTARINE_ENABLE_LINTING=OFF \
            -DOCTARINE_ENABLE_TESTS=ON \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/vcpkg_installed"
          diff_tool="$(find /usr/lib/llvm-18 -name 'clang-tidy-diff.py' 2>/dev/null | head -1)"
          if [ -z "$diff_tool" ]; then
            diff_tool="$RUNNER_TEMP/clang-tidy-diff.py"
            curl -fsSL https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-18.1.8/clang-tools-extra/clang-tidy/tool/clang-tidy-diff.py -o "$diff_tool"
          fi
          report="$(git diff -U0 "$base"...HEAD -- $changed \
            | python3 "$diff_tool" -p1 -j0 -path "build/lint" -clang-tidy-binary clang-tidy-18 2>&1)" || true
          printf '%s\n' "$report"
          # Fail on any lint finding OR any [clang-diagnostic-*] compiler/parse error so broken
          # translation units or compile_commands drift can never silently pass green.
          findings="$(printf '%s\n' "$report" \
            | grep -E '(^[^ ]+:[0-9]+:[0-9]+: (warning|error):|error:.*\[clang-diagnostic-)' || true)"
          if [ -n "$findings" ]; then
            echo "::error::clang-tidy reported issues or diagnostic errors on changed lines (see log above)."
            exit 1
          fi

      # Minimal in-repo native game module check (ENG-DX-08): verifies CMake link visibility,
      # header hygiene, GameModuleHooks seam, and native C++/Lua component bindings.
      - name: Build & test minimal native module example
        if: matrix.platform == 'linux' && matrix.preset == 'player-debug'
        shell: bash
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/minimal-native-module \
            --preset player-debug \
            -DOCTARINE_ENABLE_TESTS=ON \
            -DOCTARINE_GAME_MODULE_DIR="${GITHUB_WORKSPACE}/examples/minimal-native-module" \
            -DVCPKG_INSTALLED_DIR="${GITHUB_WORKSPACE}/build/player-debug/vcpkg_installed"
          cmake --build build/minimal-native-module \
            --target OctarineEngine OctarineLuaBehaviorTest octarine_game_module_tests --parallel
          ctest --test-dir build/minimal-native-module \
            -R "(MinimalNativeModuleTest|LuaBehaviorTest)" --output-on-failure

      - name: Stage runtime DLLs (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $cfg = if ("${{ matrix.preset }}" -match "debug") { "debug" } else { "release" }
          $out = "build/${{ matrix.preset }}/bin/$cfg"
          # Ninja single-config writes directly to bin/$cfg; vcpkg dlls already copied next to exe by CMake.
          Get-ChildItem $out

      - name: List artifact contents
        shell: bash
        run: |
          cfg="${{ contains(matrix.preset, 'debug') && 'debug' || 'release' }}"
          ls -la "build/${{ matrix.preset }}/bin/$cfg"

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && inputs.save_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OctarineEngine-${{ matrix.platform }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/bin/${{ contains(matrix.preset, 'debug') && 'debug' || 'release' }}
          if-no-files-found: error
          retention-days: 7

  # ASan+UBSan over the full unit-test suite. Catches the memory-bug class (chunk over-alignment,
  # archetype-move use-after-free) that plain builds only surface as crashes, plus UB like
  # misaligned loads and signed overflow. Debug preset so asserts stay live. The TSan counterpart
  # (ThreadPool/parallel-system races ASan cannot see) is nightly-only in sanitize-tsan.yml —
  # the two sanitizers cannot be combined in one binary.
  sanitize:
    name: linux (asan+ubsan, player-debug)
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache env (vcpkg binary cache)
        uses: ./.github/actions/vcpkg-cache-env

      - name: Install Linux build deps (SDL3 / X11 / Wayland)
        uses: ./.github/actions/linux-build-deps

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-player-debug-asan
          max-size: 250M

      - name: Configure CMake
        run: cmake --preset asan-ubsan

      - name: Build
        run: cmake --build --preset asan-ubsan --parallel

      - name: Run engine tests (ctest under ASan+UBSan)
        env:
          # halt_on_error makes the first finding fail the test instead of logging past it.
          # Leak checking stays off for now: exit-time leaks in non-instrumented third-party
          # libs (SDL/Lua via vcpkg) would drown real findings - revisit once a baseline exists.
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/asan-ubsan --output-on-failure

  # Diff coverage gate. Instruments binaries with Clang source-based coverage, runs ctest,
  # and enforces >= 80% coverage on modified lines under src/ (excluding non-headless GUI panels).
  coverage:
    name: diff-coverage (clang, >=80%)
    needs: lint
    if: github.event_name != 'push'
    # Uses ubuntu-latest (Clang 21+) rather than ubuntu-24.04 (Clang 18), because Clang 18
    # rejects sol2 3.5.0's upvalue_this_member_variable::call dependent noexcept address.
    # Coverage does not publish binaries (so glibc 2.39 floor does not apply) and uses Clang,
    # and vcpkg-cache-env isolates its cache by ImageOS + compiler ABI.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build deps (SDL3 / X11 / Wayland)
        uses: ./.github/actions/linux-build-deps
        with:
          extras: clang llvm

      - name: Export GitHub Actions cache env (vcpkg binary cache)
        uses: ./.github/actions/vcpkg-cache-env

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-player-debug-coverage
          max-size: 250M

      - name: Configure CMake
        run: cmake --preset player-debug -DOCTARINE_ENABLE_COVERAGE=ON -DOCTARINE_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build/player-debug --parallel

      - name: Run diff coverage gate
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          ./scripts/coverage.sh --diff "$base" --threshold 80.0 --exclude-pattern "src/Debug/Panels"

  # Style gate. Lightweight (no vcpkg/SDL): formats only the files a PR actually changed, so the
  # large pre-existing tree never blocks on legacy style. Auto-fixable via the CMake `format` target.
  # clang-tidy runs as a blocking changed-lines gate in the player-debug build leg above, which
  # has the compile_commands.json it needs. This job also drift-gates the static system/event catalogs.
  lint:
    name: lint (clang-format)
    runs-on: ubuntu-24.04
    env:
      # Pinned for reproducibility. clang-format output differs between major versions, so a floating
      # `apt install clang-format` (Ubuntu runner default) drifts from contributors' local versions and
      # churns formatting. The pip wheel is the same binary on every platform. Bump here AND re-run the
      # `format` target tree-wide when upgrading. Match locally: pipx install clang-format==<this version>
      CLANG_FORMAT_VERSION: 18.1.8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: clang-format changed files
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'src/*' 'tests/*' 'examples/*' \
            | grep -E '\.(cpp|h|hpp)$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed C/C++ sources to format-check."
            exit 0
          fi
          printf 'checking:\n%s\n' "$(printf '  %s\n' "${files[@]}")"
          if ! clang-format --dry-run --Werror -style=file "${files[@]}"; then
            echo "::error::clang-format violations. Fix with pinned clang-format ${CLANG_FORMAT_VERSION}: cmake --build build/player-debug --target format"
            exit 1
          fi

      # systems.json / events.json are produced by static source inspection (no build needed), so
      # the drift gate lives here in the lightweight lint job rather than the player-debug leg that
      # gates the runtime-introspected components.json / modules.json. Regenerate + diff.
      - name: Check system/event catalog drift
        shell: bash
        run: |
          if ! python3 scripts/gen_api_catalogs.py --check; then
            git diff -- generated/systems.json generated/events.json | head -200
            exit 1
          fi

      # Includes under src/ must be src-rooted (src/ is on every target's include path via
      # cmake/octarine_library.cmake), never parent-relative ("../"). Parent-relative paths are
      # brittle (break when a file moves) and the same header ends up spelled two ways across the
      # tree. Keep this an invariant, not a one-time cleanup.
      - name: Check for parent-relative includes under src/
        shell: bash
        run: |
          if hits="$(git grep -n '#include "\.\.' -- 'src/' || true)" && [ -n "$hits" ]; then
            echo "::error::parent-relative ('../') includes found under src/. Use src-rooted paths (e.g. \"EventBus/EventBus.h\"):"
            echo "$hits"
            exit 1
          fi

      - name: Check architecture, layer DAG, and genre purity
        shell: bash
        run: |
          python3 scripts/check_architecture.py
