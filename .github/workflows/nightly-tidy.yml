name: Nightly clang-tidy

# Whole-tree clang-tidy sweep. The per-PR gate in build.yml only checks lines a PR touches, so
# pre-existing debt and cross-file drift accumulate invisibly; this job walks every src/ + tests/
# translation unit nightly and publishes the full report as an artifact. Non-blocking by design —
# findings never fail the job (only infrastructure errors do), so it is a trend report, not a gate.
# Same pinned clang-tidy major (18) as the PR gate so the two never disagree on check behavior.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC nightly

jobs:
  check-changes:
    name: Check for recent commits
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if main changed in last 24h
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Non-scheduled event (${{ github.event_name }}); proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          count="$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&since=${since}&per_page=1" --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "Found commits on main since ${since}; proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits on main since ${since}; skipping nightly clang-tidy run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  tidy:
    name: linux (clang-tidy, whole tree)
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache env (vcpkg binary cache)
        uses: ./.github/actions/vcpkg-cache-env

      - name: Install Linux build deps (SDL3 / X11 / Wayland)
        uses: ./.github/actions/linux-build-deps
        with:
          extras: clang-18 clang-tidy-18

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-lint-tidy
          max-size: 250M

      # Configure and build with the `lint` preset (OCTARINE_ENABLE_PCH=OFF) so compile_commands.json
      # carries zero PCH flags or GCC-only driver flags when run-clang-tidy walks the tree.
      - name: Configure CMake (lint preset)
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset lint -DOCTARINE_ENABLE_LINTING=OFF -DOCTARINE_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset lint --parallel

      # Full-tree sweep over src/ + tests/. Lint check warnings remain non-blocking trend metrics,
      # while [clang-diagnostic-*] errors are preserved in the report and fail the job if clang-tidy
      # fails to parse any translation unit.
      - name: clang-tidy (whole tree, non-blocking lint checks)
        shell: bash
        run: |
          runner="$(command -v run-clang-tidy-18 || find /usr/lib/llvm-18 -name 'run-clang-tidy*' | head -1)"
          "$runner" -p build/lint -quiet "^$GITHUB_WORKSPACE/(src|tests)/" \
            > build/lint/tidy-report.txt 2>&1 || true

          findings="$(grep -E '^[^ ]+:[0-9]+:[0-9]+: (warning|error):' build/lint/tidy-report.txt \
            | sort -u || true)"
          count="$(printf '%s' "$findings" | grep -c . || true)"

          {
            echo "clang-tidy whole-tree findings: $count"
            echo
            echo "By check:"
            printf '%s\n' "$findings" | grep -oE '\[[a-z0-9.,*-]+\]$' | sort | uniq -c | sort -rn
          } > build/lint/tidy-summary.txt || true

          cat build/lint/tidy-summary.txt
          echo "::notice::clang-tidy whole-tree findings: $count (report in artifact)"

          diag_errors="$(grep -E 'error:.*\[clang-diagnostic-' build/lint/tidy-report.txt | grep -v '/vcpkg_installed/' || true)"
          if [ -n "$diag_errors" ]; then
            echo "::error::clang-tidy hit compiler/parse errors ([clang-diagnostic-*]):"
            printf '%s\n' "$diag_errors" | head -50
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: |
            build/lint/tidy-report.txt
            build/lint/tidy-summary.txt
          if-no-files-found: error
          retention-days: 7
